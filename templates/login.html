{% extends "base.html" %}
{% block content %}
<div class="card login-card">
    <h2>用户登录</h2>
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="post" class="login-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group captcha-group">
            <label>验证码</label>
            <div class="captcha-row">
                <div class="captcha-svg">{{ captcha_svg | safe }}</div>
                <button type="button" class="btn-refresh" onclick="refreshCaptcha()" title="换一张">🔄</button>
            </div>
            <input type="text" id="captcha" name="captcha" placeholder="输入计算结果" maxlength="3" required>
        </div>
        <button type="submit" class="btn">登录</button>
    </form>
</div>

<script>
function refreshCaptcha() {
    fetch('/captcha')
        .then(r => r.text())
        .then(svg => {
            document.querySelector('.captcha-svg').innerHTML = svg;
        });
}
</script>
{% endblock %}
