<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>帮助中心</title></head>
<body>
<h2>📖 帮助中心</h2>

<h3>常见问题</h3>

<h4>1. 如何注册账号？</h4>
<p>点击导航栏的"注册"链接，填写用户名、密码、邮箱和手机号即可完成注册。</p>

<h4>2. 忘记密码怎么办？</h4>
<p>请联系管理员 admin 重置密码。</p>

<h4>3. 如何充值？</h4>
<p>登录后进入个人中心，在充值区域输入金额点击充值即可。</p>

<h4>4. 支持哪些头像格式？</h4>
<p>支持 JPG、PNG、GIF、BMP、WEBP 格式，大小不超过 16MB。</p>

<h4>5. 如何搜索其他用户？</h4>
<p>在首页的搜索框中输入用户名或邮箱关键字即可搜索。</p>

</body>
</html>
